[project]
name = "dbt-learning"
version = "0.1.0"
description = "Projet d'apprentissage dbt et Analytics Engineering avec BigQuery"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-bigquery (==1.11.3)",
    "dbt-core (>=1.11.6,<1.12)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
package-mode = false
